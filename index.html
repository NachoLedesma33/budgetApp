<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./icon/icons8-presupuesto-60.png">
    <title>budgets</title>
  </head>
  <body onload="loadApp()">
    <div class="headboard">
      <div class="budget">
        <div class="budget_setup">
          <input
            type="number"
            id="initial-budget"
            class="initial-budget"
            placeholder="Enter your initial budget"
            step="0.01"
            min="0"
          >
          <button type="button" id="set-budget" class="set-budget-btn">
            Set Budget
          </button>
        </div>
        <div class="budget_title">Budget Available</div>
        <div class="budget_value" id="budgets">$0.00</div>
        <div class="budget_income cleanstyles">
          <div class="budget_income--text">Incomes</div>
          <div class="right">
            <div class="budget_income--value" id="incomes">$0.00</div>
            <div class="budget_income--percent">&nbsp;</div>
          </div>
        </div>
        <div class="budget_expenses cleanstyles">
          <div class="budget_expenses--text">Expenses</div>
          <div class="right">
            <div class="budget_expenses--value" id="expenses">$0.00</div>
            <div class="budget_expenses--percent" id="percents">0%</div>
          </div>
        </div>
      </div>
    </div>

    <form id="form" onsubmit="return addData();">
      <div class="add">
        <div class="add_container">
          <select name="type" id="type" class="add_type" required>
            <option value="" disabled selected>Income Type</option>
            <option value="income">Income (+)</option>
            <option value="expense">Expense (-)</option>
          </select>
          <input
            type="text"
            class="add_description"
            name="description"
            id="description"
            placeholder="Description"
            required>
          <input
            type="number"
            class="add_value"
            name="value"
            id="value"
            placeholder="Value"
            step="0.01"
            min="0.01"
            required>
          <button type="submit" class="add_btn">+</button>
        </div>
      </div>
    </form>
    <div class="container cleanstyles">
      <div class="income">
        <h2 class="income_title">Incomes</h2>
        <div id="list-incomes"></div>
      </div>
      <div class="expenses">
        <h2 class="expenses_title">Expenses</h2>
        <div id="list_expenses"></div>
      </div>
    </div>

    <script src="https://unpkg.com/ionicons@5.2.3/dist/ionicons.js"></script>
    <script src="./Data.js"></script>
    <script src="./Income.js"></script>
    <script src="./Expenses.js"></script>
    <script src="./app.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
